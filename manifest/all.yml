# ============================================================
# ResourceQuota
# ============================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: myrq
  namespace: webapps
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "5"

---

# ============================================================
# ConfigMap
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-config
  namespace: webapps
data:
  DB_HOST: "192.168.1.2"
  DB_PORT: "1521"
  DB_SERVICE_NAME: "xepdb1"
  
---

# ============================================================
# Deployment
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: webapps
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pharmacy
  template:
    metadata:
      labels:
        app: pharmacy
    spec:
      containers:
        - name: cont-1
          image: ayaz4411/pharmacy:latest .
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: my-config
            - secretRef:
                name: my-secret

          resources:
            requests:
              cpu: "100m"
              memory: "250Mi"
            limits:
              cpu: "250m"
              memory: "500Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

---

# ============================================================
# Secret
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: my-secret
  namespace: webapps
type: Opaque
data:
  DB_USER: cGhhcm1hY3lfdXNlcg==
  DB_PASSWORD: UGhhcm1hY3kxMjM=

---

# ============================================================
# Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: my-service
  namespace: webapps
spec:
  type: ClusterIP
  selector:
    app: pharmacy
  ports:
    - port: 3000
      targetPort: 3000

---

# ============================================================
# HPA
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-hpa
  namespace: webapps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---

# ============================================================
# Ingress
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: webapps
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-service
                port:
                  number: 3000
			
---
			
# ============================================================
# pdb
# ============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-app
  namespace: webapps
spec:
  minAvailable: 2
  selector:
    matchLables:
	  app: nginx
